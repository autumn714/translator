[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-app"
version = "2.0.0"
description = "내부망 번역기 — 텍스트·문서 번역, 글 다듬기, 용어집 (도면 분석기의 Qwen vLLM 서버를 같이 사용)"
readme = "README.md"
requires-python = ">=3.11"
# 서버 설치는 requirements.txt(버전·해시 고정)로 한다. 여기에는 하한만 적는다.
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "langdetect>=1.0.9",
    "lxml>=6.1.3",
    "pymupdf>=1.28.2",
    "olefile>=0.47",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "anyio>=4.4.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["translator_app*"]

[tool.setuptools.package-data]
translator_app = ["static/*", "static/js/*"]
