[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-app"
version = "0.1.0"
description = "Internal English-to-Korean translation app with automatic preview UX."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ctranslate2>=4.7.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langdetect>=1.0.9",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sentencepiece>=0.2.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["translator_app*"]

[tool.setuptools.package-data]
translator_app = ["static/*"]
