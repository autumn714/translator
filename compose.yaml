services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:gemma4}
    container_name: translator-vllm
    ipc: host
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -eu
        SRC_DIR=/models/source
        WORK_DIR=/vllm-work
        RUNTIME_DIR=/vllm-work/runtime-model/gemma-4-E4B-it
        mkdir -p "$$WORK_DIR" "$$XDG_CACHE_HOME" "$$HF_HOME" "$$TRITON_CACHE_DIR" "$$NUMBA_CACHE_DIR" "$$RUNTIME_DIR"
        find "$$RUNTIME_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        for path in "$$SRC_DIR"/*; do
          [ -e "$$path" ] || continue
          name="$$(basename "$$path")"
          ln -sfn "$$path" "$$RUNTIME_DIR/$$name"
        done
        if [ ! -f "$$RUNTIME_DIR/tokenizer_config.json" ]; then
          echo "tokenizer_config.json not found in $$SRC_DIR" >&2
          exit 1
        fi
        if [ ! -f "$$RUNTIME_DIR/processor_config.json" ]; then
          echo "processor_config.json not found in $$SRC_DIR" >&2
          exit 1
        fi
        exec vllm serve "$$RUNTIME_DIR" --tokenizer "$$RUNTIME_DIR" --served-model-name gemma-4-E4B-it --dtype half --gpu-memory-utilization 0.9 --max-model-len 2048 --limit-mm-per-prompt '{"image":0,"audio":0}' --async-scheduling
    environment:
      NVIDIA_VISIBLE_DEVICES: ${VLLM_GPU_DEVICE:-0}
      XDG_CACHE_HOME: /vllm-work/cache
      HF_HOME: /vllm-work/hf
      TRITON_CACHE_DIR: /vllm-work/triton
      NUMBA_CACHE_DIR: /vllm-work/numba
    gpus: all
    volumes:
      - ${MODEL_PATH:?set MODEL_PATH in .env to the host directory containing gemma-4-E4B-it}:/models/source:ro
      - ./data/vllm-work:/vllm-work
    ports:
      - "${VLLM_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: translator-app
    depends_on:
      - vllm
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 7860
      TRANSLATOR_HOME: /app
      GLOSSARY_PATH: /app/data/glossary/default.json
      ENGINE_TYPE: openai_compatible
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_API_KEY: EMPTY
      OPENAI_MODEL: gemma-4-E4B-it
      OPENAI_API_MODE: chat
      OPENAI_SYSTEM_PROMPT: You are a dedicated enterprise translation engine. Translate multilingual input into the requested target language. Preserve formatting, lists, and line breaks. Return only the translated text in the requested target language.
      OPENAI_TEMPERATURE: "0"
      OPENAI_MAX_TOKENS: "768"
      OPENAI_PARALLELISM: "6"
      OPENAI_CHUNK_CHARS: "700"
      OPENAI_SEGMENT_CACHE_SIZE: "2048"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    volumes:
      - ./data:/app/data
    ports:
      - "${APP_PORT:-7860}:7860"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
